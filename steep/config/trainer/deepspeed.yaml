type: lightning.pytorch.Trainer

args:
  max_epochs: 1
  gradient_clip_val: 1.0
  accelerator: gpu
  devices: auto
  strategy: deepspeed_stage_2
  precision: 16-mixed
  accumulate_grad_batches: 1
  log_every_n_steps: 1
  enable_progress_bar: true
  enable_model_summary: false
  num_sanity_val_steps: 0
